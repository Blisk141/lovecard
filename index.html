<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffe4ee">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="format-detection" content="telephone=no">
  <title>Для Ульяны</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --rose-deep: #9b3d5c;
      --rose: #d45f82;
      --rose-soft: #f6c2d2;
      --ink: #3d2130;
      --ink-soft: #6d4556;
      --glow: rgba(212, 95, 130, 0.35);
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      width: 100%;
      height: 100%;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    body {
      font-family: "Manrope", -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      background:
        radial-gradient(ellipse 90% 60% at 50% 0%, #ffd0e0 0%, transparent 55%),
        radial-gradient(ellipse 50% 40% at 100% 80%, #ffc4d6 0%, transparent 50%),
        radial-gradient(ellipse 45% 35% at 0% 60%, #ffe0ea 0%, transparent 50%),
        linear-gradient(180deg, #fff5f8 0%, #ffe4ee 48%, #ffd2e2 100%);
      min-height: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      min-height: -webkit-fill-available;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow-x: hidden;
      overflow-y: auto;
      padding:
        max(0.75rem, var(--safe-top))
        max(1rem, var(--safe-left), var(--safe-right))
        max(0.75rem, var(--safe-bottom));
      overscroll-behavior: none;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.35;
      background-image:
        radial-gradient(circle, rgba(255, 255, 255, 0.7) 0 1px, transparent 1.5px);
      background-size: 48px 48px;
      -webkit-mask-image: radial-gradient(ellipse 70% 60% at 50% 40%, black, transparent);
      mask-image: radial-gradient(ellipse 70% 60% at 50% 40%, black, transparent);
      animation: drift-dots 36s linear infinite;
    }

    @keyframes drift-dots {
      from { background-position: 0 0; }
      to { background-position: 0 -96px; }
    }

    .petals {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
    }

    .petal {
      position: absolute;
      width: 14px;
      height: 18px;
      border-radius: 50% 50% 50% 0;
      background: linear-gradient(135deg, var(--rose-soft), var(--rose));
      opacity: 0.45;
      top: -40px;
      animation: fall linear infinite;
      transform: rotate(45deg);
      will-change: transform, opacity;
    }

    .petal:nth-child(odd) {
      background: linear-gradient(135deg, #ffd6e4, #e07a9a);
      width: 10px;
      height: 14px;
    }

    .petal:nth-child(1) { left: 8%; animation-duration: 11s; animation-delay: 0s; }
    .petal:nth-child(2) { left: 18%; animation-duration: 14s; animation-delay: 2s; }
    .petal:nth-child(3) { left: 28%; animation-duration: 12s; animation-delay: 4.5s; }
    .petal:nth-child(4) { left: 42%; animation-duration: 16s; animation-delay: 1s; }
    .petal:nth-child(5) { left: 55%; animation-duration: 13s; animation-delay: 3s; }
    .petal:nth-child(6) { left: 67%; animation-duration: 15s; animation-delay: 0.5s; }
    .petal:nth-child(7) { left: 78%; animation-duration: 11.5s; animation-delay: 5s; }
    .petal:nth-child(8) { left: 88%; animation-duration: 14.5s; animation-delay: 2.8s; }
    .petal:nth-child(9) { left: 35%; animation-duration: 17s; animation-delay: 6s; }
    .petal:nth-child(10) { left: 60%; animation-duration: 12.5s; animation-delay: 7s; }
    .petal:nth-child(11) { left: 12%; animation-duration: 15s; animation-delay: 8s; }
    .petal:nth-child(12) { left: 72%; animation-duration: 13s; animation-delay: 9s; }

    @keyframes fall {
      0% {
        transform: translate3d(0, 0, 0) rotate(45deg);
        opacity: 0;
      }
      8% { opacity: 0.45; }
      100% {
        transform: translate3d(40px, 110vh, 0) rotate(320deg);
        opacity: 0;
      }
    }

    .scene {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      text-align: center;
      padding: 0.5rem 0.25rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: calc(100dvh - var(--safe-top) - var(--safe-bottom) - 1.5rem);
      transform-style: preserve-3d;
      transition: transform 0.25s ease-out;
    }

    .dedication {
      font-family: "Caveat", cursive;
      font-size: clamp(1.2rem, 4.5vw, 1.45rem);
      font-weight: 600;
      color: var(--ink-soft);
      letter-spacing: 0.01em;
      margin-bottom: 0.15rem;
      opacity: 0;
      animation: rise-in 0.9s ease 0.15s forwards;
    }

    .name {
      font-family: "Cormorant Garamond", serif;
      font-weight: 600;
      font-style: italic;
      font-size: clamp(3.1rem, 14vw, 4.2rem);
      line-height: 0.95;
      color: var(--rose-deep);
      letter-spacing: 0.01em;
      margin-bottom: 0.4rem;
      opacity: 0;
      animation: rise-in 1s ease 0.35s forwards;
    }

    .lead {
      font-family: "Cormorant Garamond", serif;
      font-size: clamp(1.05rem, 4.2vw, 1.25rem);
      font-style: italic;
      color: var(--ink-soft);
      max-width: 22ch;
      margin: 0 auto 1rem;
      line-height: 1.4;
      opacity: 0;
      animation: rise-in 1s ease 0.55s forwards;
      padding: 0 0.5rem;
    }

    @keyframes rise-in {
      from {
        opacity: 0;
        transform: translate3d(0, 14px, 0);
      }
      to {
        opacity: 1;
        transform: translate3d(0, 0, 0);
      }
    }

    .heart-stage {
      position: relative;
      width: min(48vw, 180px);
      height: min(48vw, 180px);
      min-width: 150px;
      min-height: 150px;
      margin: 0 auto 0.65rem;
      opacity: 0;
      animation: rise-in 1s ease 0.7s forwards;
      cursor: pointer;
      outline: none;
      border: none;
      background: transparent;
      display: grid;
      place-items: center;
      flex-shrink: 0;
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
    }

    .heart-stage:focus-visible {
      box-shadow: 0 0 0 3px rgba(212, 95, 130, 0.4);
      border-radius: 50%;
    }

    .heart-stage:active .heart-svg {
      transform: scale(0.96);
    }

    .heart-glow {
      position: absolute;
      width: 78%;
      height: 78%;
      border-radius: 50%;
      background: radial-gradient(circle, var(--glow) 0%, transparent 68%);
      animation: glow-pulse 2.4s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes glow-pulse {
      0%, 100% { transform: scale(0.9); opacity: 0.5; }
      50% { transform: scale(1.12); opacity: 0.85; }
    }

    .heart-svg {
      width: 100%;
      height: 100%;
      transform-origin: center center;
      animation: heartbeat 1.6s ease-in-out infinite;
      filter: drop-shadow(0 10px 18px rgba(155, 61, 92, 0.26));
      transition: filter 0.35s ease;
    }

    @media (hover: hover) and (pointer: fine) {
      .heart-stage:hover .heart-svg,
      .heart-stage:focus-visible .heart-svg {
        filter: drop-shadow(0 14px 26px rgba(155, 61, 92, 0.38));
      }
    }

    .heart-stage.is-open {
      width: min(34vw, 120px);
      height: min(34vw, 120px);
      min-width: 108px;
      min-height: 108px;
      margin-bottom: 0.5rem;
      transition:
        width 0.55s ease,
        height 0.55s ease,
        min-width 0.55s ease,
        min-height 0.55s ease,
        margin 0.55s ease;
    }

    .heart-stage.is-open .heart-svg {
      animation: heartbeat-fast 0.9s ease-in-out infinite;
    }

    .scene.is-open .dedication,
    .scene.is-open .lead {
      opacity: 0.85;
    }

    .scene.is-open .name {
      font-size: clamp(2.4rem, 11vw, 3.2rem);
      transition: font-size 0.55s ease;
    }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      14% { transform: scale(1.07); }
      28% { transform: scale(1); }
      42% { transform: scale(1.045); }
      70% { transform: scale(1); }
    }

    @keyframes heartbeat-fast {
      0%, 100% { transform: scale(1); }
      20% { transform: scale(1.09); }
      40% { transform: scale(1); }
      60% { transform: scale(1.055); }
      80% { transform: scale(1); }
    }

    .heart-fill {
      fill: url(#heartGradient);
      stroke: #b8486a;
      stroke-width: 0.3;
    }

    .heart-shine {
      fill: rgba(255, 255, 255, 0.4);
      pointer-events: none;
    }

    .hint {
      font-size: clamp(0.8rem, 3.3vw, 0.9rem);
      font-weight: 500;
      color: var(--ink-soft);
      letter-spacing: 0.04em;
      opacity: 0;
      animation: rise-in 0.9s ease 1s forwards, hint-breathe 2.4s ease-in-out 1.8s infinite;
      margin-bottom: 0.85rem;
      transition: opacity 0.35s ease, height 0.35s ease, margin 0.35s ease;
    }

    @keyframes hint-breathe {
      0%, 100% { opacity: 0.7; }
      50% { opacity: 1; }
    }

    .hint.is-hidden {
      opacity: 0 !important;
      animation: none;
      height: 0;
      margin: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .message {
      max-height: 0;
      overflow: hidden;
      opacity: 0;
      transform: translate3d(0, 10px, 0);
      transition:
        max-height 0.8s cubic-bezier(0.22, 1, 0.36, 1),
        opacity 0.55s ease 0.08s,
        transform 0.55s ease 0.08s;
      width: 100%;
      padding: 0 0.5rem;
    }

    .message.is-visible {
      max-height: 240px;
      opacity: 1;
      transform: translate3d(0, 0, 0);
    }

    .message p {
      font-family: "Cormorant Garamond", serif;
      font-size: clamp(1.12rem, 4.5vw, 1.35rem);
      line-height: 1.45;
      color: var(--ink);
      max-width: 24ch;
      margin: 0 auto;
      text-wrap: balance;
    }

    .footer-note {
      margin-top: clamp(0.9rem, 3vh, 1.25rem);
      font-size: clamp(0.64rem, 2.6vw, 0.72rem);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(109, 69, 86, 0.7);
      opacity: 0;
      animation: rise-in 0.9s ease 1.15s forwards;
    }

    .burst {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: visible;
    }

    .spark {
      position: absolute;
      left: 50%;
      top: 45%;
      width: 8px;
      height: 8px;
      margin: -4px;
      border-radius: 50%;
      background: var(--rose);
      opacity: 0;
      transform: translate3d(0, 0, 0) scale(0.4);
    }

    .spark.is-flying {
      animation: spark-fly 0.9s ease-out forwards;
    }

    @keyframes spark-fly {
      0% {
        opacity: 1;
        transform: translate3d(0, 0, 0) scale(1);
      }
      100% {
        opacity: 0;
        transform: translate3d(var(--dx), var(--dy), 0) scale(0.2);
      }
    }

    /* —— Phone: fill the screen like a card —— */
    @media (max-width: 767px) {
      .petal:nth-child(n+7) {
        display: none;
      }

      .scene {
        max-width: 100%;
        padding: 0.25rem 0.15rem;
      }
    }

    @media (max-width: 767px) and (max-height: 720px) {
      .name {
        font-size: clamp(2.7rem, 12vw, 3.4rem);
        margin-bottom: 0.25rem;
      }

      .lead {
        font-size: clamp(1rem, 3.8vw, 1.15rem);
        margin-bottom: 0.7rem;
      }

      .heart-stage {
        width: min(42vw, 150px);
        height: min(42vw, 150px);
        min-width: 128px;
        min-height: 128px;
        margin-bottom: 0.45rem;
      }

      .heart-stage.is-open {
        width: min(30vw, 108px);
        height: min(30vw, 108px);
        min-width: 96px;
        min-height: 96px;
      }

      .scene.is-open .name {
        font-size: clamp(2.2rem, 10vw, 2.8rem);
      }

      .footer-note {
        margin-top: 0.7rem;
      }
    }

    @media (max-width: 767px) and (max-height: 600px) {
      .lead {
        display: none;
      }

      .heart-stage {
        width: 112px;
        height: 112px;
        min-width: 112px;
        min-height: 112px;
      }

      .message p {
        font-size: 1.05rem;
        max-width: 28ch;
      }
    }

    /* —— Desktop / tablet landscape: wide stage, postcard composition —— */
    @media (min-width: 768px) {
      body {
        padding: 2.5rem;
        background:
          radial-gradient(ellipse 70% 55% at 50% 35%, #ffe0ea 0%, transparent 60%),
          radial-gradient(ellipse 40% 35% at 12% 20%, #ffc9db 0%, transparent 55%),
          radial-gradient(ellipse 45% 40% at 90% 75%, #ffb9d0 0%, transparent 50%),
          linear-gradient(165deg, #fff8fb 0%, #ffe8f1 45%, #ffd6e6 100%);
      }

      .scene {
        max-width: 560px;
        min-height: auto;
        padding: 2.75rem 3rem 2.5rem;
        border-radius: 28px;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.55) 0%, rgba(255, 240, 246, 0.42) 100%);
        box-shadow:
          0 1px 0 rgba(255, 255, 255, 0.7) inset,
          0 24px 60px rgba(155, 61, 92, 0.12),
          0 4px 18px rgba(155, 61, 92, 0.06);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
      }

      .dedication {
        font-size: 1.55rem;
      }

      .name {
        font-size: 5rem;
        margin-bottom: 0.55rem;
      }

      .lead {
        font-size: 1.4rem;
        max-width: 26ch;
        margin-bottom: 1.5rem;
      }

      .heart-stage {
        width: 230px;
        height: 230px;
        min-width: 230px;
        min-height: 230px;
        margin-bottom: 1rem;
      }

      .heart-stage.is-open {
        width: 160px;
        height: 160px;
        min-width: 160px;
        min-height: 160px;
        margin-bottom: 0.75rem;
      }

      .scene.is-open .name {
        font-size: 3.8rem;
      }

      .hint {
        font-size: 0.92rem;
        margin-bottom: 1.1rem;
      }

      .message.is-visible {
        max-height: 200px;
      }

      .message p {
        font-size: 1.5rem;
        max-width: 28ch;
        line-height: 1.5;
      }

      .footer-note {
        margin-top: 1.6rem;
        font-size: 0.74rem;
      }
    }

    @media (min-width: 1100px) {
      .scene {
        max-width: 600px;
        padding: 3.25rem 3.5rem 2.85rem;
      }

      .name {
        font-size: 5.4rem;
      }

      .heart-stage {
        width: 250px;
        height: 250px;
        min-width: 250px;
        min-height: 250px;
      }

      .heart-stage.is-open {
        width: 170px;
        height: 170px;
        min-width: 170px;
        min-height: 170px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }

      .dedication, .name, .lead, .heart-stage, .hint, .footer-note {
        opacity: 1;
      }

      .petal {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div class="petals" aria-hidden="true">
    <span class="petal"></span>
    <span class="petal"></span>
    <span class="petal"></span>
    <span class="petal"></span>
    <span class="petal"></span>
    <span class="petal"></span>
    <span class="petal"></span>
    <span class="petal"></span>
    <span class="petal"></span>
    <span class="petal"></span>
    <span class="petal"></span>
    <span class="petal"></span>
  </div>

  <main class="scene">
    <p class="dedication">маленькая страница только для</p>
    <h1 class="name">Ульяны</h1>
    <p class="lead">потому что рядом с тобой всё становится теплее</p>

    <button
      class="heart-stage"
      type="button"
      aria-expanded="false"
      aria-controls="love-message"
      aria-label="Открыть послание"
      id="heartBtn"
    >
      <span class="heart-glow" aria-hidden="true"></span>
      <svg class="heart-svg" viewBox="0 0 32 29.6" aria-hidden="true">
        <defs>
          <linearGradient id="heartGradient" x1="0%" y1="0%" x2="80%" y2="100%">
            <stop offset="0%" stop-color="#ff8fb0"/>
            <stop offset="48%" stop-color="#e45f86"/>
            <stop offset="100%" stop-color="#b83d64"/>
          </linearGradient>
        </defs>
        <path
          class="heart-fill"
          d="M23.6,0c-3.4,0-6.4,2.2-7.6,5.3C14.8,2.2,11.8,0,8.4,0
            C3.8,0,0,3.8,0,8.4c0,4.3,3.4,7.9,8.5,12.7c2.5,2.3,5.4,4.8,7.3,6.4c1.9-1.6,4.8-4.1,7.3-6.4
            c5.1-4.8,8.5-8.4,8.5-12.7C32,3.8,28.2,0,23.6,0z"
        />
        <ellipse class="heart-shine" cx="11" cy="9" rx="3.2" ry="2.2" transform="rotate(-28 11 9)"/>
      </svg>
      <span class="burst" id="burst" aria-hidden="true"></span>
    </button>

    <p class="hint" id="hint">нажми на сердце</p>

    <div class="message" id="love-message" role="region" aria-live="polite">
      <p>
        Если бы я умел складывать чувства в слова,
        между нами никогда бы не было тишины
      </p>
    </div>

    <p class="footer-note">сделано с нежностью · для тебя</p>
  </main>

  <script>
    (function () {
      const scene = document.querySelector(".scene");
      const btn = document.getElementById("heartBtn");
      const message = document.getElementById("love-message");
      const hint = document.getElementById("hint");
      const burst = document.getElementById("burst");
      const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      const canParallax = window.matchMedia("(hover: hover) and (pointer: fine)").matches;
      const isCoarse = window.matchMedia("(pointer: coarse)").matches;
      let open = false;

      function spawnSparks() {
        const count = isCoarse ? 10 : 18;
        for (let i = 0; i < count; i++) {
          const spark = document.createElement("span");
          spark.className = "spark";
          const angle = (Math.PI * 2 * i) / count + Math.random() * 0.3;
          const dist = 50 + Math.random() * (isCoarse ? 60 : 95);
          spark.style.setProperty("--dx", Math.cos(angle) * dist + "px");
          spark.style.setProperty("--dy", Math.sin(angle) * dist + "px");
          spark.style.background =
            i % 2 === 0
              ? "linear-gradient(135deg, #ff8fb0, #d45f82)"
              : "linear-gradient(135deg, #ffe8f0, #f6c2d2)";
          burst.appendChild(spark);
          requestAnimationFrame(function () {
            spark.classList.add("is-flying");
          });
          spark.addEventListener("animationend", function () {
            spark.remove();
          });
        }
      }

      function openMessage() {
        if (open) return;
        open = true;
        scene.classList.add("is-open");
        btn.classList.add("is-open");
        btn.setAttribute("aria-expanded", "true");
        message.classList.add("is-visible");
        hint.classList.add("is-hidden");
        spawnSparks();
      }

      btn.addEventListener("click", openMessage);

      if (!reduceMotion && canParallax) {
        let raf = 0;
        window.addEventListener("pointermove", function (e) {
          cancelAnimationFrame(raf);
          raf = requestAnimationFrame(function () {
            const x = (e.clientX / window.innerWidth - 0.5) * 8;
            const y = (e.clientY / window.innerHeight - 0.5) * 6;
            scene.style.transform =
              "perspective(1100px) rotateY(" + x + "deg) rotateX(" + -y + "deg)";
          });
        });
      }
    })();
  </script>
</body>
</html>
